<h2>{{ transaction ? 'Edit Transaction' : 'New Transaction'}}</h2>

<form (ngSubmit)="onSubmit(transactionForm)" #transactionForm="ngForm">
    <input class="input--wide" type="text" name="description" palceholder="Description" [(ngModel)]="formData.description" #description="ngModel" required>
    <input type="number" name="amount" placeholder="Amount" [(ngModel)]="formData.amount" #amount="ngModel" min="0.01" required>

    <select name="type" [(ngModel)]="formData.type">
        @for(type of types; track types){
            <option value="{{ type }}">{{ type }}</option>
        }
    </select>

    <button type="submit" [disabled]="!transactionForm.valid"> {{transaction ? 'Update' : 'Add'}}</button>

    @if(transactionForm.touched) {
        <button type="button" (click)="transactionForm.resetForm()">Clear</button>
    }
    @if(transaction) {
        <button type="button" (click)="onCancel()">Cancel</button>
    }
</form>

@if(transactionForm.touched && description.invalid){
   <div class="message--error">Please enter a valid description.</div>
 
} @if(transactionForm.touched && amount.invalid){
   <div class="message--error">Please enter an amount greater than zero.</div> 
}
